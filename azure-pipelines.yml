trigger: none

pool:
  name: Default
  demands:
    - Agent.Name -equals cravo-frontend-vm

steps:

  # ============================================================
  # 1. CHECKOUT SOURCE
  # ============================================================
  - checkout: self
    displayName: "Checkout Cravo Frontend"


  # ============================================================
  # 2. DIAGNOSE SUDO & SYSTEM ENVIRONMENT
  # ============================================================
  - script: |
      set -x

      echo "=== Identity ==="
      whoami
      id
      hostname
      pwd

      echo "=== SUDO LOCATION ==="
      which sudo
      sudo --version | head -2

      echo "=== SUDO LIST ==="
      sudo -n -l

      echo "=== SUDO TRUE TEST ==="
      sudo -n true
      echo "sudo_true_exit=$?"

      echo "=== NGINX LOCATION ==="
      which nginx
      ls -l /usr/sbin/nginx

      echo "=== NGINX TEST ==="
      sudo -n /usr/sbin/nginx -t
      echo "nginx_exit=$?"

      echo "=== SYSTEMCTL TEST ==="
      sudo -n /usr/bin/systemctl is-active nginx
      echo "systemctl_exit=$?"
    displayName: "Diagnose Frontend VM Sudo"


  # ============================================================
  # 3. VERIFY FRONTEND VM
  # ============================================================
  - script: |
      set -e

      echo "========================================"
      echo "        CRAVO FRONTEND VM CHECK"
      echo "========================================"

      echo ""
      echo "=== Agent Information ==="
      hostname
      whoami
      pwd

      echo ""
      echo "=== Node.js ==="
      node --version
      npm --version

      echo ""
      echo "=== Docker ==="
      docker --version
      docker compose version
      /usr/bin/systemctl is-active docker

      echo ""
      echo "=== Nginx ==="
      sudo -n /usr/sbin/nginx -t
      sudo -n /usr/bin/systemctl is-active nginx

      echo ""
      echo "=== Frontend Directory ==="
      sudo -n mkdir -p /var/www/cravo/dist
      sudo -n ls -ld /var/www/cravo
      sudo -n ls -ld /var/www/cravo/dist

      echo ""
      echo "=== Sudo Check ==="
      sudo -n true

      echo ""
      echo "Frontend VM verification completed successfully."
    displayName: "Verify Frontend VM"


  # ============================================================
  # 4. INSTALL DEPENDENCIES
  # ============================================================
  - script: |
      set -e

      echo "========================================"
      echo "      INSTALLING DEPENDENCIES"
      echo "========================================"

      npm ci

      echo ""
      echo "Dependencies installed successfully."
    displayName: "Install Frontend Dependencies"


    # ============================================================
  # 5. BUILD FRONTEND
  # ============================================================
  - script: |
      set -e

      echo "========================================"
      echo "        BUILDING CRAVO FRONTEND"
      echo "========================================"

      echo ""
      echo "=== Production API Configuration ==="
      echo "VITE_API_URL=$VITE_API_URL"

      if [ "$VITE_API_URL" != "/api" ]; then
        echo "ERROR: VITE_API_URL must be /api"
        exit 1
      fi

      echo ""
      echo "=== Building frontend ==="

      npm run build

      echo ""
      echo "=== Build Output ==="
      ls -lah dist

      echo ""
      echo "=== Verifying API URL was embedded ==="

      if grep -RIl --include='*.js' \
        -F 'http://localhost:5000/api' dist/assets >/dev/null 2>&1; then
        echo "ERROR: Production build still contains localhost:5000/api"
        exit 1
      fi

      echo "No localhost:5000/api reference found in production build."

      echo ""
      echo "=== index.html ==="
      test -f dist/index.html

      echo ""
      echo "Frontend build completed successfully."
    displayName: "Build Frontend"
    env:
      VITE_API_URL: /api
      
  # ============================================================
  # 6. DEPLOY FRONTEND TO NGINX
  # ============================================================
  - script: |
      set -e

      echo "========================================"
      echo "       DEPLOYING CRAVO FRONTEND"
      echo "========================================"

      DEPLOY_DIR="/var/www/cravo"
      NEW_DIST="/var/www/cravo/dist.new"
      LIVE_DIST="/var/www/cravo/dist"

      echo ""
      echo "=== Preparing deployment directory ==="

      sudo -n rm -rf "$NEW_DIST"
      sudo -n mkdir -p "$NEW_DIST"

      echo ""
      echo "=== Copying new frontend build ==="

      sudo -n cp -r dist/. "$NEW_DIST/"

      echo ""
      echo "=== Validating new build ==="

      sudo -n test -f "$NEW_DIST/index.html"
      sudo -n ls -lah "$NEW_DIST"

      echo ""
      echo "=== Setting ownership ==="

      sudo -n chown -R www-data:www-data "$NEW_DIST"

      echo ""
      echo "=== Replacing live frontend ==="

      sudo -n rm -rf "$LIVE_DIST"
      sudo -n mv "$NEW_DIST" "$LIVE_DIST"

      echo ""
      echo "=== Deployed Files ==="

      sudo -n ls -lah "$LIVE_DIST"

      echo ""
      echo "=== Testing Nginx Configuration ==="

      sudo -n /usr/sbin/nginx -t

      echo ""
      echo "=== Reloading Nginx ==="

      sudo -n /usr/bin/systemctl reload nginx

      echo ""
      echo "=== Nginx Status ==="

      sudo -n /usr/bin/systemctl is-active nginx

      echo ""
      echo "Frontend deployment completed successfully."
    displayName: "Deploy Frontend to Nginx"


  # ============================================================
  # 7. VERIFY DEPLOYMENT
  # ============================================================
  - script: |
      set -e

      echo "========================================"
      echo "       VERIFYING FRONTEND DEPLOYMENT"
      echo "========================================"

      echo ""
      echo "=== Frontend Files ==="

      sudo -n test -f /var/www/cravo/dist/index.html
      sudo -n ls -lah /var/www/cravo/dist

      echo ""
      echo "=== Frontend HTTP Test ==="

      FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/)

      echo "Frontend HTTP Status: $FRONTEND_STATUS"

      if [ "$FRONTEND_STATUS" != "200" ]; then
        echo "ERROR: Frontend did not return HTTP 200."
        exit 1
      fi

      echo ""
      echo "=== API Proxy Test ==="

      API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/)

      echo "API Proxy HTTP Status: $API_STATUS"

      echo ""
      echo "=== Nginx Status ==="

      sudo -n /usr/bin/systemctl is-active nginx

      echo ""
      echo "========================================"
      echo "   CRAVO FRONTEND DEPLOYMENT SUCCESS"
      echo "========================================"
    displayName: "Verify Deployment"